# Included at server level AND in every location that has its own add_header:
# nginx drops all inherited add_header lines from a location that sets any of
# its own, so a header set only at server level silently vanishes there.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera stays allowed for barcode and receipt scanning on this origin only.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
