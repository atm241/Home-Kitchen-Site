server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for all client routes
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the Express container
    location /api/ {
        # Photo upload and receipt scanning post images as base64 JSON, which
        # inflates ~4/3. Express accepts 20mb; nginx's default is 1m, which
        # would reject every photo upload with a 413 before Express saw it.
        client_max_body_size 20m;
        # Claude vision calls (recipe photo parsing) can take well over a
        # minute; the default 60s proxy read timeout would cut them off.
        proxy_read_timeout 180s;
        # Express mounts all routes under /api/ so preserve the prefix
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploaded recipe photos are written to a volume by the Express container
    # and served by it. Without this block they 404 in production, because
    # try_files above would hand /uploads/* to index.html instead.
    location /uploads/ {
        proxy_pass http://server:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Filenames are content-unique (timestamp + random), so they never
        # change meaning and can be cached hard.
        expires 30d;
        add_header Cache-Control "public";
    }

    # Cache static assets aggressively (CRA hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker itself, or clients won't pick up updates
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }
}
