server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for all client routes
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the Express container
    location /api/ {
        # Express mounts all routes under /api/ so preserve the prefix
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets aggressively (CRA hashes filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
