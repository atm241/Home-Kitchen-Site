# Pinned so volume names stay stable. Without this, Compose derives the
# project name from the directory, so renaming or cloning the folder
# elsewhere would create fresh empty volumes and look like total data
# loss. "homekitchensite" is what the current directory already resolves
# to, so this changes nothing for an existing deployment.
name: homekitchensite

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_kitchen
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchen} -d home_kitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD}@db:5432/home_kitchen
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set in .env}
      INSTAGRAM_OEMBED_TOKEN: ${INSTAGRAM_OEMBED_TOKEN:-}
      # Quote any value whose text contains ": " — unquoted, YAML reads it as a
      # nested mapping and the whole file fails to parse.
      JWT_SECRET: "${JWT_SECRET:?set in .env — generate with openssl rand -base64 48}"
      # Recipe/ingredient recommendations go quiet without this — no error, just
      # empty results. Optional: everything else works without it.
      SPOONACULAR_API_KEY: "${SPOONACULAR_API_KEY:-}"
      # CORS origin. Must be the address you actually open the app from — using
      # a phone on the LAN means the Pi's address here, not localhost, or every
      # API call is rejected and the app looks broken for no visible reason.
      CLIENT_URL: "${CLIENT_URL:?set in .env — e.g. http://192.168.1.50:3000}"
    # Bring the database up to date before serving. Safe to re-run: applied
    # migrations are recorded in schema_migrations and skipped.
    command: sh -c "node migrate.js && node dist/index.js"
    volumes:
      # Uploaded recipe photos — without this they are destroyed on every rebuild
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # No ports exposed to host — nginx proxies to it on the internal network.
    # Uncomment for direct debugging:
    # ports:
    #   - "5001:5001"

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
  uploads:
